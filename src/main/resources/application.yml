spring:
  application:
    name: secure-notes-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_notes}
    username: ${DB_USERNAME:secure_notes}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: secure-notes-api
    audience: secure-notes-clients
    access-token-ttl: 15m

server:
  error:
    include-message: never
    include-stacktrace: never

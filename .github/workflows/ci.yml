name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build package
        run: mvn --batch-mode clean verify

  sast:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile all Java sources
        run: mvn --batch-mode clean test-compile

      - name: Run SpotBugs and Find Security Bugs
        run: mvn --batch-mode spotbugs:check

      - name: Upload SpotBugs reports
        if: always() && hashFiles('target/spotbugs.xml', 'target/spotbugsXml.xml', 'target/reports/spotbugs.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-reports
          path: |
            target/spotbugs.xml
            target/spotbugsXml.xml
            target/reports/spotbugs.html
          if-no-files-found: warn

  sca:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode dependency-check:check

      - name: Upload Dependency-Check reports
        if: always() && hashFiles('target/dependency-check-report.*') != ''
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn
